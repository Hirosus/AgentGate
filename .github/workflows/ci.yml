name: AgentGate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: packages/mcp-server
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
        working-directory: packages/python-sdk
      - run: uv run ruff check src tests
        working-directory: packages/python-sdk
      - run: uv run ruff check ../../infra/build_lambda.py
        working-directory: packages/python-sdk
      - run: uv run mypy src tests
        working-directory: packages/python-sdk
      - run: uv run pytest -v
        working-directory: packages/python-sdk
      - run: uv run agentgate-eval --scenarios ../../benchmarks/scenarios.json --output ../../benchmarks/latest-report.json --traces ../../data/traces.jsonl --min-tool-pass-rate 0.95 --min-delta 0.50
        working-directory: packages/python-sdk

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: git diff --exit-code packages/dashboard/src/data
        working-directory: .
      - run: npm test
      - run: npm run build
