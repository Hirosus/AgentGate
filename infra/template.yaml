AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AgentGate serverless webhook intake, DynamoDB idempotency store, and S3 eval artifacts

Parameters:
  WebhookSecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared HMAC-SHA256 secret for AgentGate webhook verification

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.11

Resources:
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S
      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  EvalReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebhookIntakeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../packages/python-sdk/
      Handler: agentgate.aws_lambda.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyTable
        - S3WritePolicy:
            BucketName: !Ref EvalReportsBucket
      Environment:
        Variables:
          AGENTGATE_WEBHOOK_SECRET: !Ref WebhookSecret
          AGENTGATE_STORE_BACKEND: dynamodb
          AGENTGATE_WEBHOOK_MAX_AGE_SECONDS: "300"
          IDEMPOTENCY_TABLE: !Ref IdempotencyTable
          REPORTS_BUCKET: !Ref EvalReportsBucket
      Events:
        HealthCheck:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
        TriageWebhook:
          Type: HttpApi
          Properties:
            Path: /webhooks/triage
            Method: POST

Outputs:
  HealthEndpointUrl:
    Description: HTTP API health check endpoint URL for AgentGate
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/health"
  WebhookEndpointUrl:
    Description: HTTP API endpoint URL for signed AgentGate webhooks
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhooks/triage"
