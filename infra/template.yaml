AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AgentGate serverless webhook intake and DynamoDB idempotency store

Parameters:
  WebhookSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Shared HMAC-SHA256 secret for AgentGate webhook verification
  IdempotencyTtlSeconds:
    Type: Number
    Default: 86400
    MinValue: 60
    Description: TTL in seconds for stored DynamoDB webhook idempotency records
  TriageMode:
    Type: String
    Default: none
    AllowedValues:
      - none
      - deterministic
    Description: Optional inline webhook triage mode (none or deterministic)

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.11

Resources:
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S
      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  WebhookIntakeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: build/lambda/
      Handler: agentgate.aws_lambda.handler
      Architectures:
        - x86_64
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt IdempotencyTable.Arn
      Environment:
        Variables:
          AGENTGATE_WEBHOOK_SECRET: !Ref WebhookSecret
          AGENTGATE_STORE_BACKEND: dynamodb
          AGENTGATE_WEBHOOK_MAX_AGE_SECONDS: "300"
          AGENTGATE_IDEMPOTENCY_TTL_SECONDS: !Ref IdempotencyTtlSeconds
          AGENTGATE_TRIAGE_MODE: !Ref TriageMode
          IDEMPOTENCY_TABLE: !Ref IdempotencyTable
      Events:
        HealthCheck:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
        TriageWebhook:
          Type: HttpApi
          Properties:
            Path: /webhooks/triage
            Method: POST

Outputs:
  HealthEndpointUrl:
    Description: HTTP API health check endpoint URL for AgentGate
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/health"
  WebhookEndpointUrl:
    Description: HTTP API endpoint URL for signed AgentGate webhooks
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhooks/triage"
